# Proxy pools for Crawlee tiered rotation
# Set CRAWLEE_PROXY_URL or replace placeholders for production

proxy_urls:
  - "${CRAWLEE_PROXY_URL:-}"

tiered_proxy_urls:
  standard:
    - "${CRAWLEE_PROXY_URL:-}"
  premium:
    - "${CRAWLEE_PROXY_URL:-}"
    # Novada residential — set CRAWLEE_PROXY_URL in local .env (never commit credentials)

defaults:
  use_session_pool: true
  retry_on_blocked: true
  max_concurrency: 5
  max_pages: 100
